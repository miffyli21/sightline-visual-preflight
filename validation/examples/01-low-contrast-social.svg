      <stop offset="0" stop-color="#d7ddd7"/>
      <stop offset="0.48" stop-color="#cbd8df"/>
      <stop offset="1" stop-color="#e9dcc9"/>
    </linearGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="34"/></filter>
  </defs>
  <rect width="1080" height="1440" fill="url(#bg)"/>
  <circle cx="190" cy="224" r="212" fill="#f5e8cf" opacity=".8" filter="url(#blur)"/>
