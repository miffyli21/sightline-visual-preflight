<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440" role="img" aria-labelledby="title desc">
  <title id="title">Sightline 小红书测试招募封面</title>
  <desc id="desc">一张主标题为一张海报真的看得清吗的视觉预检工具招募封面。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7dbb4"/>
      <stop offset=".5" stop-color="#f8eee0"/>
      <stop offset="1" stop-color="#bfe3d6"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1080" height="1440" fill="url(#background)"/>
  <circle cx="172" cy="202" r="196" fill="#f5b856" opacity=".62" filter="url(#soft)"/>
  <circle cx="970" cy="1186" r="252" fill="#5aa995" opacity=".45" filter="url(#soft)"/>
  <rect x="64" y="62" width="952" height="1316" rx="54" fill="#fffdf8" opacity=".76"/>
  <rect x="110" y="110" width="360" height="62" rx="31" fill="#202025"/>
  <text x="142" y="151" fill="#fffdf8" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="700">LOCAL VISUAL PREFLIGHT</text>
  <text x="112" y="404" fill="#24242a" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="94" font-weight="700">一张海报，</text>
  <text x="112" y="522" fill="#24242a" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="94" font-weight="700">真的看得清吗？</text>
  <rect x="112" y="578" width="560" height="16" rx="8" fill="#efc44b"/>
  <text x="118" y="672" fill="#53626a" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="35">招募 10 位小品牌视觉测试者</text>
  <g transform="translate(112,800)">
    <rect width="856" height="294" rx="28" fill="#202d3b"/>
    <rect x="32" y="32" width="462" height="230" rx="16" fill="#e4d7c9"/>
    <text x="62" y="115" fill="#e7efe8" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="50" font-weight="700">今晚活动</text>
    <text x="62" y="176" fill="#e7efe8" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="50" font-weight="700">把时间留给自己</text>
    <rect x="62" y="204" width="214" height="36" rx="18" fill="#7aa18e"/>
    <text x="312" y="227" fill="#61727d" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="22">低对比度示意</text>
    <rect x="539" y="46" width="275" height="198" rx="21" fill="#fffdf8"/>
    <rect x="566" y="76" width="166" height="22" rx="11" fill="#202d3b"/>
    <rect x="566" y="122" width="204" height="22" rx="11" fill="#202d3b"/>
    <rect x="566" y="168" width="135" height="42" rx="21" fill="#f1c54b"/>
  </g>
  <text x="116" y="1194" fill="#2e3940" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="33" font-weight="700">小屏 · 灰阶 · 色觉模拟 · 本地预检</text>
  <text x="116" y="1268" fill="#6b7478" font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif" font-size="27">自发起工具测试 · 图片不会上传</text>
</svg>
